[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-upgrade-lab"
version = "0.1.0.dev1"
description = "Rehearse paused LangGraph workflows against candidate application code"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["langgraph>=1.2.16,<1.3", "langgraph-checkpoint>=4.3.0,<5", "langgraph-checkpoint-sqlite>=3.1.2,<4"]

[project.scripts]
agent-upgrade = "agent_upgrade_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
